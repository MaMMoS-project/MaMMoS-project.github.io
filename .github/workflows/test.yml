name: JS Conversion Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: prefix-dev/setup-pixi@v0.11.3

      - name: Run tests
        run: pixi run pytest -v
