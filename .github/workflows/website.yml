name: update website

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - name: Initialisation
      uses: actions/checkout@v4

    - name: Setup environment
      uses: prefix-dev/setup-pixi@v0.11.3

    - name: generate materials pages
      run: |
        git clone --depth 1 https://github.com/MaMMoS-project/uppsala-data.git ../uppsala-data
        pixi run python tools/generate_materials.py ../uppsala-data

    - name: build website
      run: pixi run make html

    - name: link check
      run: pixi run make linkcheck
      continue-on-error: true  # check for broken links but do not fail job, an error is still displayed in the job output

    - name: upload pages artifacts
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/html/

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    runs-on: ubuntu-latest

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

